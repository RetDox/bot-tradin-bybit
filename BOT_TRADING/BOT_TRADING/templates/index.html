<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOT PRO</title>

<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0b0d0f">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
    --bg: #07080b;
    --panel: #111418;
    --panel-soft: #171b20;
    --border: #2b3138;
    --text: #f5f7f8;
    --muted: #9aa4ad;
    --green: #00e68a;
    --red: #ff4d57;
    --amber: #f5b84b;
    --cyan: #52d5ff;
    --violet: #a78bfa;
}

* {
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    margin: 0;
    background:
        radial-gradient(circle at top left, rgba(0, 230, 138, 0.08), transparent 26rem),
        radial-gradient(circle at bottom right, rgba(82, 213, 255, 0.07), transparent 28rem),
        var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

button,
input {
    font: inherit;
}

.page {
    width: min(1180px, calc(100% - 28px));
    margin: 0 auto;
    padding: 22px 0 34px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 18px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.brand-mark {
    display: grid;
    width: 42px;
    height: 42px;
    place-items: center;
    border: 1px solid rgba(0, 230, 138, 0.45);
    border-radius: 8px;
    background: linear-gradient(145deg, rgba(0, 230, 138, 0.18), rgba(82, 213, 255, 0.08));
    color: var(--green);
}

.brand h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 38px);
    line-height: 1;
    letter-spacing: 0;
}

.brand p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13px;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 10px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 118px;
    height: 42px;
    padding: 0 16px;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    transition: transform .16s ease, border-color .16s ease, background .16s ease;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn-start {
    background: var(--green);
    color: #04100a;
    font-weight: 800;
}

.btn-stop {
    background: rgba(255, 77, 87, 0.16);
    border-color: rgba(255, 77, 87, 0.5);
    color: #ffb8bd;
}

.grid {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.75fr);
    gap: 14px;
}

.panel {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(17, 20, 24, 0.9);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

.panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px 16px;
    border-bottom: 1px solid var(--border);
}

.panel-title {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0;
    font-size: 14px;
    font-weight: 800;
}

.panel-title svg {
    color: var(--cyan);
}

.status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 30px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    background: var(--panel-soft);
    font-size: 12px;
    font-weight: 800;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--red);
    box-shadow: 0 0 16px rgba(255, 77, 87, 0.8);
}

.status-pill.on {
    color: #bfffe2;
    border-color: rgba(0, 230, 138, 0.45);
}

.status-pill.on .status-dot {
    background: var(--green);
    box-shadow: 0 0 18px rgba(0, 230, 138, 0.9);
}

.metrics {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    padding: 14px;
}

.metric {
    min-height: 112px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-soft);
}

.metric-label {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
}

.metric-value {
    margin-top: 16px;
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 900;
    line-height: 1;
    overflow-wrap: anywhere;
}

.metric-note {
    margin-top: 10px;
    color: var(--muted);
    font-size: 12px;
    overflow-wrap: anywhere;
}

.positive { color: var(--green); }
.negative { color: var(--red); }
.neutral { color: var(--text); }

.chart-wrap {
    height: 330px;
    padding: 12px 14px 16px;
}

.side {
    display: grid;
    gap: 14px;
}

.settings {
    padding: 14px;
    display: grid;
    gap: 15px;
}

.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.setting-label {
    display: grid;
    gap: 3px;
}

.setting-label strong {
    font-size: 13px;
}

.setting-label span {
    color: var(--muted);
    font-size: 12px;
}

.toggle {
    position: relative;
    width: 52px;
    height: 30px;
}

.toggle input {
    position: absolute;
    opacity: 0;
}

.toggle span {
    position: absolute;
    inset: 0;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #22272d;
    cursor: pointer;
}

.toggle span::before {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    top: 3px;
    left: 3px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform .18s ease, background .18s ease;
}

.toggle input:checked + span {
    border-color: rgba(0, 230, 138, 0.55);
    background: rgba(0, 230, 138, 0.14);
}

.toggle input:checked + span::before {
    transform: translateX(22px);
    background: var(--green);
}

.range-row {
    display: grid;
    gap: 9px;
}

.range-meta {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
}

input[type="range"] {
    width: 100%;
    accent-color: var(--green);
}

.number-input {
    width: 76px;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #0d1014;
    color: var(--text);
}

.signal-box {
    padding: 14px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.log-panel {
    grid-column: 1 / -1;
}

.logs {
    height: 250px;
    overflow-y: auto;
    padding: 12px 14px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
    color: #d7dde3;
}

.log-line {
    display: grid;
    grid-template-columns: 82px minmax(0, 1fr);
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(43, 49, 56, 0.55);
}

.log-time {
    color: var(--muted);
}

.empty-log {
    color: var(--muted);
}

@media (max-width: 900px) {
    .topbar {
        align-items: stretch;
        flex-direction: column;
    }

    .actions {
        justify-content: stretch;
    }

    .btn {
        flex: 1;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .metrics {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 480px) {
    .page {
        width: min(100% - 18px, 1180px);
        padding-top: 14px;
    }

    .brand-mark {
        width: 38px;
        height: 38px;
    }

    .chart-wrap {
        height: 260px;
    }

    .log-line {
        grid-template-columns: 1fr;
        gap: 2px;
    }
}
</style>
</head>

<body>
<main class="page">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark"><i data-lucide="activity"></i></div>
            <div>
                <h1>BOT PRO</h1>
                <p id="subtitle">Trading console</p>
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-start" onclick="startBot()" title="Avvia bot">
                <i data-lucide="play"></i>
                <span>START</span>
            </button>
            <button class="btn btn-stop" onclick="stopBot()" title="Ferma bot">
                <i data-lucide="square"></i>
                <span>STOP</span>
            </button>
        </div>
    </header>

    <section class="grid">
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title"><i data-lucide="gauge"></i>Overview</h2>
                <div id="statusPill" class="status-pill">
                    <span class="status-dot"></span>
                    <span id="status">OFF</span>
                </div>
            </div>

            <div class="metrics">
                <div class="metric">
                    <div class="metric-label"><i data-lucide="wallet"></i>Balance</div>
                    <div id="balance" class="metric-value neutral">0.00</div>
                    <div id="exchange" class="metric-note">Exchange: -</div>
                </div>
                <div class="metric">
                    <div class="metric-label"><i data-lucide="trending-up"></i>Profit</div>
                    <div id="profit" class="metric-value neutral">0.00</div>
                    <div id="profitNote" class="metric-note">PnL aperto</div>
                </div>
                <div class="metric">
                    <div class="metric-label"><i data-lucide="radio"></i>Signal</div>
                    <div id="signalMain" class="metric-value neutral">NONE</div>
                    <div id="lastUpdate" class="metric-note">Ultimo update: -</div>
                </div>
            </div>

            <div class="chart-wrap">
                <canvas id="chart"></canvas>
            </div>
        </div>

        <aside class="side">
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title"><i data-lucide="sliders-horizontal"></i>Settings</h2>
                </div>
                <div class="settings">
                    <div class="setting-row">
                        <div class="setting-label">
                            <strong>AI</strong>
                            <span>Segnali automatici</span>
                        </div>
                        <label class="toggle">
                            <input type="checkbox" id="ai" onchange="saveSettings()" checked>
                            <span></span>
                        </label>
                    </div>

                    <div class="range-row">
                        <div class="range-meta">
                            <span>Risk</span>
                            <strong id="riskValue">1%</strong>
                        </div>
                        <input type="range" min="0.1" max="10" step="0.1" value="1" id="risk" oninput="saveSettings()">
                    </div>

                    <div class="setting-row">
                        <div class="setting-label">
                            <strong>Max Trades</strong>
                            <span>Limite posizioni</span>
                        </div>
                        <input class="number-input" type="number" min="1" max="20" value="2" id="maxTrades" onchange="saveSettings()">
                    </div>
                </div>
                <div class="signal-box" id="signal">NONE</div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title"><i data-lucide="shield-check"></i>Runtime</h2>
                </div>
                <div class="settings">
                    <div class="setting-row">
                        <div class="setting-label">
                            <strong>Status</strong>
                            <span id="runtimeStatus">In attesa</span>
                        </div>
                        <i data-lucide="server"></i>
                    </div>
                    <div class="setting-row">
                        <div class="setting-label">
                            <strong>Equity Points</strong>
                            <span id="equityPoints">0</span>
                        </div>
                        <i data-lucide="line-chart"></i>
                    </div>
                </div>
            </div>
        </aside>

        <div class="panel log-panel">
            <div class="panel-header">
                <h2 class="panel-title"><i data-lucide="terminal"></i>Logs</h2>
                <span class="status-pill"><span id="logCount">0</span> righe</span>
            </div>
            <div class="logs" id="log"></div>
        </div>
    </section>
</main>

<script>
const money = new Intl.NumberFormat('it-IT', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
});

let isApplyingSettings = false;

let chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
        labels: [],
        datasets: [{
            data: [],
            borderColor: "#00e68a",
            backgroundColor: "rgba(0, 230, 138, 0.12)",
            fill: true,
            pointRadius: 0,
            borderWidth: 2,
            tension: 0.35
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
            legend: { display: false },
            tooltip: {
                mode: "index",
                intersect: false,
                displayColors: false
            }
        },
        scales: {
            x: {
                display: false,
                grid: { display: false }
            },
            y: {
                ticks: { color: "#9aa4ad" },
                grid: { color: "rgba(154, 164, 173, 0.12)" }
            }
        }
    }
});

function startBot(){
    fetch("/start").then(update);
}

function stopBot(){
    fetch("/stop").then(update);
}

function saveSettings(){
    if (isApplyingSettings) return;

    const risk = document.getElementById("risk").value;
    const maxTrades = document.getElementById("maxTrades").value;
    document.getElementById("riskValue").innerText = risk + "%";

    fetch("/settings", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            risk,
            max_trades: maxTrades,
            ai: document.getElementById("ai").checked
        })
    });
}

function setStatus(status){
    const pill = document.getElementById("statusPill");
    const label = document.getElementById("status");
    label.innerText = status;
    pill.className = "status-pill " + (status === "ON" ? "on" : "");
    document.getElementById("runtimeStatus").innerText = status === "ON" ? "Bot attivo" : "Bot fermo";
}

function setProfit(value){
    const profit = Number(value || 0);
    const node = document.getElementById("profit");
    node.innerText = money.format(profit);
    node.className = "metric-value " + (profit > 0 ? "positive" : profit < 0 ? "negative" : "neutral");
    document.getElementById("profitNote").innerText = profit >= 0 ? "PnL aperto positivo" : "PnL aperto negativo";
}

function applySettings(settings){
    if (!settings) return;

    isApplyingSettings = true;
    document.getElementById("ai").checked = settings.ai === true;
    document.getElementById("risk").value = settings.risk;
    document.getElementById("riskValue").innerText = settings.risk + "%";
    document.getElementById("maxTrades").value = settings.max_trades || 2;
    isApplyingSettings = false;
}

function renderLogs(logs){
    const container = document.getElementById("log");
    container.textContent = "";

    const items = Array.isArray(logs) ? logs.slice(-80) : [];
    document.getElementById("logCount").innerText = items.length;

    if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty-log";
        empty.textContent = "Nessun log disponibile";
        container.appendChild(empty);
        return;
    }

    const now = new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    for (const item of items) {
        const row = document.createElement("div");
        row.className = "log-line";

        const time = document.createElement("span");
        time.className = "log-time";
        time.textContent = now;

        const msg = document.createElement("span");
        msg.textContent = item;

        row.appendChild(time);
        row.appendChild(msg);
        container.appendChild(row);
    }

    container.scrollTop = container.scrollHeight;
}

function updateChart(equity){
    const points = Array.isArray(equity) ? equity : [];
    document.getElementById("equityPoints").innerText = points.length;

    if (!points.length) return;

    chart.data.labels = points.map((_, i) => i + 1);
    chart.data.datasets[0].data = points;
    chart.update();
}

function update(){
    fetch("/data")
    .then(response => response.json())
    .then(data => {
        const status = data.status || "OFF";
        const signal = data.signal || "NONE";
        const exchange = data.exchange || "-";

        setStatus(status);
        document.getElementById("subtitle").innerText = exchange.toUpperCase() + " trading console";
        document.getElementById("exchange").innerText = "Exchange: " + exchange.toUpperCase();
        document.getElementById("signal").innerText = signal;
        document.getElementById("signalMain").innerText = signal.split(" ").slice(-1)[0] || "NONE";
        document.getElementById("balance").innerText = money.format(Number(data.balance || 0));
        document.getElementById("lastUpdate").innerText = "Ultimo update: " + new Date().toLocaleTimeString("it-IT");

        setProfit(data.profit);
        applySettings(data.settings);
        updateChart(data.equity);
        renderLogs(data.logs);

        if (window.lucide) lucide.createIcons();
    })
    .catch(() => {
        setStatus("OFF");
        document.getElementById("runtimeStatus").innerText = "Connessione non disponibile";
    });
}

setInterval(update, 2000);
update();

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/sw.js");
}

if (window.lucide) lucide.createIcons();
</script>
</body>
</html>

</html>
